# Harness settings are outside each arm. Every arms.<name>.hermes subtree is
# copied verbatim to runs/<run>/homes/<name>/config.yaml. Never put secrets here.
experiment:
  id: livebench-hermes-targeted-moa-15x5-v8
  upstream_commit: 00eae856aa1c1a9e9d058a65a9a94d85884034c4
  release: '2026-06-25'
  seed: 5615
  question_globs:
  - data/live_bench/*/*/question.jsonl
selection:
  # One experiment-global list. Every arm receives these exact scenarios.
  # `id` selects a pinned LiveBench record; `family` is a checked assertion.
  scenarios:
    instruction_following:
    - id: 3bde3f0d0cc7481da49d15758f8c32dbfff6eb2184c2cbd3fbbd15665ec8102d
      family: summarize
    - id: 469c2a921e910fce7859e4c351f41c9a4cda6b028386904aa22afa09cbba5351
      family: summarize
    - id: 77b0d92b8c174846eb6e247732cf556425226986a552b208ec107a5e8faeaba8
      family: simplify
    - id: a365e843fd014371b5de486fb1f161db1a3497dd3338268d33d5569f5f4d7185
      family: paraphrase
    - id: dbf2644a22244d678a05dab31e931414656027ac2b4ca9095efc1ebf0903048d
      family: story_generation
    reasoning:
    - id: bd14ba82d1fe813dcdf6c16f0f868e5f3fe92e4cee9cf5eb3fd5cb6f03d68517
      family: zebra_puzzle
      note: level 15; short 1211-character prompt
    - id: c833574b0ff6e8609bee19b36fabc48501cdcd9a64b99cd0422f54ada1acc53d
      family: zebra_puzzle
      note: level 20
    - id: 2102018493646d369865e04813606d3170a25f31f0fad3aece558969b56f97d0
      family: zebra_puzzle
      note: level 20
    - id: 20d48b97e524cd64f82b0e4fb3c597a37bae1d9357e9b2c93aad96b4c70e098e
      family: zebra_puzzle
      note: level 16
    - id: b1b1678a4f290c8ab2b85f957a0cdbba93ef0c97d1e7ab4663e46e92ebac70e8
      family: zebra_puzzle
      note: level 17
    data_analysis:
    - id: dc753a46614f7f4d1c839d06ec864324f8b6142e30bf804dae6aae8b6eb91941
      family: tablejoin
    - id: 2f1500d37ffd0e42cd2c89c04011cbbf5dd6b1f71f495156b016a967270cdded
      family: tablejoin
    - id: bd4b2031ad50538f365ac3312534d813fb7326fd90cf5056ac80b31d189cbb15
      family: tablejoin
    - id: a215b90180b104679133c979614fe0feeb770b6a3d1df4d41065e15be2ed7051
      family: tablejoin
    - id: 587e13e04d18246f787cc8d41da67701eb1343795150a63b1996c5ec8270b20e
      family: tablejoin
generation:
  samples_per_task: 5
  retry:
    max_attempts: 2
    retryable_codes: []
execution:
  mode: streaming
  workers: auto
  timeout_seconds: 1800
  baseline_arm: base
compatibility:
  # Verified reference profile. Another installed version is allowed with a
  # persistent unverified-version warning; changing this string does not add support.
  hermes:
    profile: 0.19.1
arms:
  base:
    credential_env: []
    hermes:
      model:
        provider: openai-codex
        default: gpt-5.6-sol
      agent:
        reasoning_effort: low
        disabled_toolsets: &id001
        - web
        - browser
        - terminal
        - file
        - code_execution
        - vision
        - video
        - image_gen
        - video_gen
        - bfl
        - x_search
        - tts
        - stt
        - skills
        - todo
        - memory
        - context_engine
        - session_search
        - clarify
        - delegation
        - cronjob
        - homeassistant
        - spotify
        - yuanbao
        - computer_use
      moa:
        enabled: false
        save_traces: false
  gpt_medium:
    credential_env: []
    hermes:
      model:
        provider: openai-codex
        default: gpt-5.6-sol
      agent:
        reasoning_effort: medium
        disabled_toolsets: *id001
      moa:
        enabled: false
        save_traces: false
  moa_minimax:
    credential_env:
    - OPENROUTER_API_KEY
    hermes:
      model:
        provider: moa
        default: default
      agent:
        disabled_toolsets: *id001
      moa:
        enabled: true
        default_preset: default
        active_preset: default
        save_traces: true
        presets:
          default:
            enabled: true
            degraded_reference_policy: loud
            reference_max_tokens: 50000
            max_tokens: 4096
            fanout: every_n:3
            reference_models:
            - provider: openrouter
              model: minimax/minimax-m3
            aggregator:
              provider: openai-codex
              model: gpt-5.6-sol
              reasoning_effort: low
  moa_mimo:
    credential_env:
    - OPENROUTER_API_KEY
    hermes:
      model:
        provider: moa
        default: default
      agent:
        disabled_toolsets: *id001
      moa:
        enabled: true
        default_preset: default
        active_preset: default
        save_traces: true
        presets:
          default:
            enabled: true
            degraded_reference_policy: loud
            reference_max_tokens: 50000
            max_tokens: 4096
            fanout: every_n:3
            reference_models:
            - provider: openrouter
              model: xiaomi/mimo-v2.5
            aggregator:
              provider: openai-codex
              model: gpt-5.6-sol
              reasoning_effort: low
scoring:
  implementation: livebench-objective-ground-truth
  schema_version: 2
