# Harness settings are outside each arm. Every arms.<name>.hermes subtree is
# copied verbatim to runs/<run>/homes/<name>/config.yaml. Never put secrets here.
experiment:
  id: livebench-hermes-targeted-moa-15x5-v1
  upstream_commit: 00eae856aa1c1a9e9d058a65a9a94d85884034c4
  release: '2026-06-25'
  seed: 5615
  question_globs:
  - data/live_bench/*/*/question.jsonl
selection:
  # One experiment-global list. Every arm receives these exact scenarios.
  # `id` selects a pinned LiveBench record; `family` is a checked assertion.
  scenarios:
    instruction_following:
    - id: 1a06f223c7988766f6c876404f04df808915b4bb08d1fca784eadec17e502973
      family: summarize
    - id: 469c2a921e910fce7859e4c351f41c9a4cda6b028386904aa22afa09cbba5351
      family: summarize
    - id: 0503923535fbd8badfb2ccf38989b36a8ecaa2eda332a4b515bb13932421fecd
      family: simplify
    - id: a365e843fd014371b5de486fb1f161db1a3497dd3338268d33d5569f5f4d7185
      family: paraphrase
    - id: c0e4dc6b1c4cca07e408c5952ee4013a46a8663f0fc7684453ed5ce56b87e0c9
      family: story_generation
    reasoning:
    - id: d968c11d5c594e036b8cdcb02bfd1e3251d48d1b21d8a6f9ab86eb6926ac50f8
      family: spatial
    - id: c833574b0ff6e8609bee19b36fabc48501cdcd9a64b99cd0422f54ada1acc53d
      family: zebra_puzzle
      note: level 20
    - id: 2102018493646d369865e04813606d3170a25f31f0fad3aece558969b56f97d0
      family: zebra_puzzle
      note: level 20
    - id: 6bd178380f1808eadda3b1565ac385a0ed891cb438a611a8142e9002ac35bbe4
      family: zebra_puzzle
      note: level 20
    - id: c29eb6b3c9fd3f67fba90afc62b89640ba6b6aa5f74bb2efd8d5650af6b78ff6
      family: zebra_puzzle
      note: level 20
    data_analysis:
    - id: dc753a46614f7f4d1c839d06ec864324f8b6142e30bf804dae6aae8b6eb91941
      family: tablejoin
    - id: bfe58cf09204ef9dddeb7358323fbab09c078fbc88d022c2387e0eada4470849
      family: tablereformat
    - id: bd4b2031ad50538f365ac3312534d813fb7326fd90cf5056ac80b31d189cbb15
      family: tablejoin
    - id: a215b90180b104679133c979614fe0feeb770b6a3d1df4d41065e15be2ed7051
      family: tablejoin
    - id: 587e13e04d18246f787cc8d41da67701eb1343795150a63b1996c5ec8270b20e
      family: tablejoin
generation:
  samples_per_task: 5
  retry:
    max_attempts: 1
    retry_only: none
  timeout_seconds: 1800
execution:
  parallelism: paired_arms
  workers_per_arm: 1
  baseline_arm: base
compatibility:
  # Verified reference profile. Another installed version is allowed with a
  # persistent unverified-version warning; changing this string does not add support.
  hermes:
    profile: 0.19.1
arms:
  base:
    credential_env: []
    hermes:
      model:
        provider: openai-codex
        default: gpt-5.6-sol
      agent:
        reasoning_effort: medium
        disabled_toolsets: &id001
        - web
        - browser
        - terminal
        - file
        - code_execution
        - vision
        - video
        - image_gen
        - video_gen
        - bfl
        - x_search
        - tts
        - stt
        - skills
        - todo
        - memory
        - context_engine
        - session_search
        - clarify
        - delegation
        - cronjob
        - homeassistant
        - spotify
        - yuanbao
        - computer_use
      moa:
        enabled: false
        save_traces: false
  moa:
    credential_env:
    - OPENROUTER_API_KEY
    hermes:
      model:
        provider: moa
        default: default
      agent:
        reasoning_effort: medium
        disabled_toolsets: *id001
      moa:
        enabled: true
        default_preset: default
        active_preset: default
        save_traces: true
        presets:
          default:
            enabled: true
            degraded_reference_policy: loud
            reference_max_tokens: 10000
            max_tokens: 4096
            fanout: every_n:3
            reference_models:
            - provider: openrouter
              model: minimax/minimax-m3
            aggregator:
              provider: openai-codex
              model: gpt-5.6-sol
              reasoning_effort: medium
scoring:
  implementation: livebench-objective-ground-truth
