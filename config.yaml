generation:
  samples_per_task: 10
  retry:
    max_attempts: 2
    retryable_codes: []
execution:
  mode: streaming
  workers: auto
  timeout_seconds: 1800
  baseline_arm: base
compatibility:
  # Verified reference profile. Another installed version is allowed with a
  # persistent unverified-version warning; changing this string does not add support.
  hermes:
    profile: 0.19.1
arms:
  base:
    credential_env: []
    hermes:
      model:
        provider: openai-codex
        default: gpt-5.6-sol
      agent:
        reasoning_effort: low
        disabled_toolsets: &id001
        - web
        - browser
        - terminal
        - file
        - code_execution
        - vision
        - video
        - image_gen
        - video_gen
        - bfl
        - x_search
        - tts
        - stt
        - skills
        - todo
        - memory
        - context_engine
        - session_search
        - clarify
        - delegation
        - cronjob
        - homeassistant
        - spotify
        - yuanbao
        - computer_use
      moa:
        enabled: false
        save_traces: false
  gpt_medium:
    credential_env: []
    hermes:
      model:
        provider: openai-codex
        default: gpt-5.6-sol
      agent:
        reasoning_effort: medium
        disabled_toolsets: *id001
      moa:
        enabled: false
        save_traces: false
  moa_minimax:
    credential_env:
    - OPENROUTER_API_KEY
    hermes:
      model:
        provider: moa
        default: default
      agent:
        disabled_toolsets: *id001
      moa:
        enabled: true
        default_preset: default
        active_preset: default
        save_traces: true
        presets:
          default:
            enabled: true
            degraded_reference_policy: loud
            reference_max_tokens: 50000
            max_tokens: 4096
            fanout: every_n:3
            reference_models:
            - provider: openrouter
              model: minimax/minimax-m3
            aggregator:
              provider: openai-codex
              model: gpt-5.6-sol
              reasoning_effort: low
  moa_mimo:
    credential_env:
    - OPENROUTER_API_KEY
    hermes:
      model:
        provider: moa
        default: default
      agent:
        disabled_toolsets: *id001
      moa:
        enabled: true
        default_preset: default
        active_preset: default
        save_traces: true
        presets:
          default:
            enabled: true
            degraded_reference_policy: loud
            reference_max_tokens: 50000
            max_tokens: 4096
            fanout: every_n:3
            reference_models:
            - provider: openrouter
              model: xiaomi/mimo-v2.5
            aggregator:
              provider: openai-codex
              model: gpt-5.6-sol
              reasoning_effort: low
scoring:
  implementation: livebench-objective-ground-truth
  schema_version: 2
